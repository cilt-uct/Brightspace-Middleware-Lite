{% extends 'base.html' %}

{% block header %}
<title>Middleware : Login</title>
<meta name="description" content="">
{% endblock %}

{% block content %}
    <form method="post" action="{{ url_for('login_page') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ form.username or '' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">Login</button>

        {% if form.errors %}
        <div class="errors">
            <ul>
                {% for error in form.errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </form>
{% endblock %}
