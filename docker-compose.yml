secrets:
  passwords:
    file: /usr/local/serverconfig/lite.cfg   # absolute path is OK - Compose v2 resolves it at runtime

services:
  middleware:
    container_name: middleware
    image: localhost:5000/middleware:latest
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.run
    secrets:
      - passwords
    ports:
      - 9091:9090
    logging:
      options:
        max-size: "100m"
        max-file: "5"
